<script>(function(){const box=document.getElementById("lm3d"),hud=document.getElementById("hud"),stat=document.getElementById("stat");const reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;const weak=!/[?&]force=1/.test(location.search)&&((navigator.hardwareConcurrency||4)<=2||(navigator.deviceMemory||4)<2);if(reduce||weak){hud.textContent=reduce?"Ảnh tĩnh · đang bật giảm chuyển động":"Ảnh tĩnh · máy yếu";return}const start=()=>{const cv=document.createElement("canvas");const gl=cv.getContext("webgl",{antialias:true,alpha:false,powerPreference:"low-power"});if(!gl){hud.textContent="Ảnh tĩnh · máy không hỗ trợ WebGL";return}box.insertBefore(cv,box.firstChild);const P=[],N=[],C=[];const hex=h=>[parseInt(h.slice(1,3),16)/255,parseInt(h.slice(3,5),16)/255,parseInt(h.slice(5,7),16)/255];const tri=(a,b,c,col)=>{const u=[b[0]-a[0],b[1]-a[1],b[2]-a[2]],v=[c[0]-a[0],c[1]-a[1],c[2]-a[2]];let n=[u[1]*v[2]-u[2]*v[1],u[2]*v[0]-u[0]*v[2],u[0]*v[1]-u[1]*v[0]];const l=Math.hypot(n[0],n[1],n[2])||1;n=n.map(x=>x/l);[a,b,c].forEach(p=>{P.push(p[0],p[1],p[2]);N.push(n[0],n[1],n[2]);C.push(col[0],col[1],col[2])})};const quad=(a,b,c,d,col)=>{tri(a,b,c,col);tri(a,c,d,col)};const boxM=(x,y,z,w,h,d,h6)=>{const c=hex(h6),X=x-w/2,Y=y,Z=z-d/2,X2=X+w,Y2=Y+h,Z2=Z+d;quad([X,Y,Z2],[X2,Y,Z2],[X2,Y2,Z2],[X,Y2,Z2],c);quad([X2,Y,Z],[X,Y,Z],[X,Y2,Z],[X2,Y2,Z],c);quad([X,Y2,Z2],[X2,Y2,Z2],[X2,Y2,Z],[X,Y2,Z],c);quad([X,Y,Z],[X2,Y,Z],[X2,Y,Z2],[X,Y,Z2],c);quad([X2,Y,Z2],[X2,Y,Z],[X2,Y2,Z],[X2,Y2,Z2],c);quad([X,Y,Z],[X,Y,Z2],[X,Y2,Z2],[X,Y2,Z],c)};const cyl=(x,y,z,r1,r2,h,h6,seg,cap)=>{const c=hex(h6);seg=seg||10;for(let i=0;i<seg;i++){const a=i/seg*Math.PI*2,b=(i+1)/seg*Math.PI*2;const p1=[x+Math.cos(a)*r1,y,z+Math.sin(a)*r1],p2=[x+Math.cos(b)*r1,y,z+Math.sin(b)*r1],p3=[x+Math.cos(b)*r2,y+h,z+Math.sin(b)*r2],p4=[x+Math.cos(a)*r2,y+h,z+Math.sin(a)*r2];quad(p1,p4,p3,p2,c);if(cap!==false){if(r2>0)tri([x,y+h,z],p3,p4,c);tri([x,y,z],p1,p2,c)}}};const dome=(x,y,z,r,h6)=>{const c=hex(h6),st=6,sg=12;for(let i=0;i<st;i++)for(let j=0;j<sg;j++){const t1=i/st*Math.PI/2,t2=(i+1)/st*Math.PI/2,a1=Math.PI*j/sg,a2=Math.PI*(j+1)/sg;const pt=(t,a)=>[x+Math.cos(a)*Math.cos(t)*r,y+Math.sin(t)*r*.8,z-Math.sin(a)*Math.cos(t)*r];quad(pt(t1,a1),pt(t1,a2),pt(t2,a2),pt(t2,a1),c)}};boxM(0,-.05,0,8,.05,6,"#EFC3D0");boxM(0,0,-3,8,4.2,.1,"#F8DCE4");boxM(-4,0,0,.1,4.2,6,"#F6D3DD");boxM(0,0,-2.94,8,.12,.02,"#E7AFC0");for(let i=0;i<9;i++)boxM(-3.7+i*.26,.05,-2.75+Math.sin(i*1.3)*.08,.24,3.9,.06,i%2?"#F3CAD6":"#F7D6E0");boxM(-2.6,3.95,-2.75,2.6,.06,.06,"#C9A86E");boxM(1.9,1.7,-2.94,1.1,1.4,.04,"#C9A86E");boxM(1.9,1.77,-2.91,.96,1.26,.04,"#FDF3F6");boxM(-.6,2.4,-2.82,1.8,.05,.3,"#FFF4F6");["#B44D70","#D98BA5","#F7C1D0","#C9A86E","#8E3A59","#F2A9A0","#E8A6BA"].forEach((h,i)=>{cyl(-1.35+i*.25,2.45,-2.8,.06,.06,.22,h,8);cyl(-1.35+i*.25,2.67,-2.8,.03,.03,.08,"#3F2633",6)});boxM(0,1,-.6,2.4,.08,1.1,"#FFF4F6");boxM(0,.96,-.6,2.42,.04,1.12,"#C9A86E");[[-1.1,-1.05],[1.1,-1.05],[-1.1,-.15],[1.1,-.15]].forEach(p=>cyl(p[0],0,p[1],.04,.04,.96,"#C9A86E",8));boxM(-.75,1.08,-.45,.7,.03,.45,"#F7C1D0");dome(.45,1.08,-.5,.32,"#F7C1D0");boxM(.45,1.08,-.6,.66,.03,.3,"#FFF4F6");["#B44D70","#D98BA5","#F2A9A0","#C9A86E"].forEach((h,i)=>{cyl(-.95+i*.12,1.08,-.9,.04,.04,.14,h,8)});cyl(0,3.2,-.6,.38,.06,.32,"#F7D6E0",14);cyl(0,3.52,-.6,.01,.01,.7,"#C9A86E",4,false);cyl(0,3.18,-.6,.12,.12,.04,"#FFF8E6",10);const chair=(x,z,rot)=>{const s=rot?-1:1;boxM(x,.48,z,.62,.14,.6,"#E8A6BA");boxM(x,.62,z+s*.27,.62,.6,.12,"#E8A6BA");[[-.26,-.24],[.26,-.24],[-.26,.24],[.26,.24]].forEach(p=>cyl(x+p[0],0,z+p[1],.03,.02,.48,"#C9A86E",6))};chair(0,.45,false);chair(-.2,-1.65,true);cyl(3,0,-2.3,.28,.22,.5,"#FFF4F6",12);for(let i=0;i<7;i++){const a=i/7*6.28;cyl(3+Math.cos(a)*.12,.5,-2.3+Math.sin(a)*.12,.09,0,.8+i%3*.15,"#A9C8A0",5)}cyl(2.4,0,.4,.3,.3,.04,"#FFF4F6",14);cyl(2.4,.04,.4,.03,.03,.55,"#C9A86E",6);cyl(2.4,.59,.4,.36,.36,.04,"#FFF4F6",14);cyl(2.35,.63,.4,.07,.06,.1,"#FFFFFF",8);const vcount=P.length/3;const vs="attribute vec3 p;attribute vec3 n;attribute vec3 c;uniform mat4 m;varying vec3 vc;varying float vd;void main(){gl_Position=m*vec4(p,1.);vec3 L=normalize(vec3(.45,.9,.6));float d=max(dot(n,L),0.);float b=max(dot(n,normalize(vec3(-.6,.3,.4))),0.);vc=c*(.7+.36*d)+vec3(1.,.93,.95)*.06*b;vd=gl_Position.z;}";const fs="precision mediump float;varying vec3 vc;varying float vd;void main(){vec3 fog=vec3(.98,.9,.93);gl_FragColor=vec4(mix(vc,fog,clamp((vd-8.)/12.,0.,.25)),1.);}";const sh=(t,s)=>{const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);return o};const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(pr);gl.useProgram(pr);if(!gl.getProgramParameter(pr,gl.LINK_STATUS)){cv.remove();hud.textContent="Ảnh tĩnh · lỗi đồ hoạ";return}const buf=(arr,name)=>{const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(arr),gl.STATIC_DRAW);const l=gl.getAttribLocation(pr,name);gl.enableVertexAttribArray(l);gl.vertexAttribPointer(l,3,gl.FLOAT,false,0,0)};buf(P,"p");buf(N,"n");buf(C,"c");const um=gl.getUniformLocation(pr,"m");gl.enable(gl.DEPTH_TEST);gl.clearColor(.98,.9,.93,1);const persp=(f,a,n,fa)=>{const t=1/Math.tan(f/2);return[t/a,0,0,0,0,t,0,0,0,0,(fa+n)/(n-fa),-1,0,0,2*fa*n/(n-fa),0]};const mul=(a,b)=>{const o=new Array(16).fill(0);for(let i=0;i<4;i++)for(let j=0;j<4;j++)for(let k=0;k<4;k++)o[j*4+i]+=a[k*4+i]*b[j*4+k];return o};const look=(e,t)=>{let z=[e[0]-t[0],e[1]-t[1],e[2]-t[2]];let l=Math.hypot(...z);z=z.map(v=>v/l);let x=[z[2],0,-z[0]];l=Math.hypot(...x);x=x.map(v=>v/l);const y=[z[1]*x[2]-z[2]*x[1],z[2]*x[0]-z[0]*x[2],z[0]*x[1]-z[1]*x[0]];return[x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,-(x[0]*e[0]+x[1]*e[1]+x[2]*e[2]),-(y[0]*e[0]+y[1]*e[1]+y[2]*e[2]),-(z[0]*e[0]+z[1]*e[1]+z[2]*e[2]),1]};let yaw=.35,tYaw=.35,pitch=.32,tPitch=.32,drag=null,auto=true,run=true,inView=true,frames=0,t0=performance.now(),fps=0;const resize=()=>{const r=box.getBoundingClientRect(),d=Math.min(window.devicePixelRatio||1,1.75);cv.width=Math.round(r.width*d);cv.height=Math.round(r.height*d);gl.viewport(0,0,cv.width,cv.height)};resize();window.addEventListener("resize",resize,{passive:true});cv.addEventListener("pointerdown",e=>{drag={x:e.clientX,y:e.clientY,yaw:tYaw,pitch:tPitch};auto=false;cv.setPointerCapture(e.pointerId)});cv.addEventListener("pointermove",e=>{if(!drag){if(e.pointerType==="mouse"){const r=box.getBoundingClientRect();tYaw=.35+((e.clientX-r.left)/r.width-.5)*.7;auto=false}return}tYaw=drag.yaw+(e.clientX-drag.x)/220;tPitch=Math.max(.08,Math.min(.7,drag.pitch+(e.clientY-drag.y)/400))});const up=()=>{drag=null};cv.addEventListener("pointerup",up);cv.addEventListener("pointercancel",up);window.addEventListener("scroll",()=>{const r=box.getBoundingClientRect();const k=1-(r.top+r.height/2)/window.innerHeight;tPitch=Math.max(.12,Math.min(.6,.22+k*.35))},{passive:true});document.addEventListener("visibilitychange",()=>{run=!document.hidden;if(run)requestAnimationFrame(loop)});new IntersectionObserver(en=>{inView=en[0].isIntersecting;if(inView&&run)requestAnimationFrame(loop)}).observe(box);const loop=now=>{if(!run||!inView)return;if(auto)tYaw=.35+Math.sin(now/4200)*.35;yaw+=(tYaw-yaw)*.08;pitch+=(tPitch-pitch)*.08;const R=7.2,tg=[0,1.1,-.9],e=[tg[0]+Math.sin(yaw)*Math.cos(pitch)*R,tg[1]+Math.sin(pitch)*R,tg[2]+Math.cos(yaw)*Math.cos(pitch)*R];gl.uniformMatrix4fv(um,false,mul(persp(.75,cv.width/cv.height,.1,40),look(e,tg)));gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.drawArrays(gl.TRIANGLES,0,vcount);frames++;if(now-t0>1e3){fps=Math.round(frames*1e3/(now-t0));frames=0;t0=now;hud.textContent="3D · "+(vcount/3|0)+" tam giác · "+fps+" khung/giây";window.__lm3dFps=fps}requestAnimationFrame(loop)};document.getElementById("fb").style.display="none";requestAnimationFrame(loop);stat.textContent="Cảnh: "+(vcount/3|0)+" tam giác, dựng bằng mã (không tải mô hình/ảnh).";window.__lm3dTris=vcount/3|0
