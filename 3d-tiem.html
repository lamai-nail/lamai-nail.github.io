:root{--pink:#F7C1D0;--rose:#EFC3D0;--plum:#3F2633;--berry:#B44D70;--cream:#FFF4F6;--brass:#C9A86E}

html{background:#fff9f9;color:var(--plum);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
body{margin:0;padding:clamp(12px,3vw,28px)}
.lamai-3d{max-width:1000px;margin:auto}
.head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:14px}
.brand{font:400 clamp(23px,3vw,32px)/1.08 Georgia,"Times New Roman",serif;letter-spacing:.13em;color:var(--plum)}
.kicker{font-size:10px;letter-spacing:.19em;color:var(--berry);font-weight:700;margin-bottom:5px}
.sub{font-size:12px;line-height:1.35;color:#79606a;margin-top:6px}
.tabs{display:flex;gap:5px;background:#ffedf1;border:1px solid #f4d9df;padding:4px;border-radius:100px}
.tabs button,.controls button{font:600 12px system-ui,-apple-system,sans-serif;border:0;cursor:pointer;transition:background .2s,color .2s}
.tabs button{padding:10px 15px;border-radius:100px;color:#775562;background:transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{background:white;color:var(--plum);box-shadow:0 2px 10px #ad75831e}
.stage{position:relative;isolation:isolate;width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:18px;background:radial-gradient(ellipse at 48% 35%,#fff8f7 8%,#f5dce1 73%,#ecc4cc 110%);border:1px solid #ead0d4;box-shadow:0 12px 36px #64364612}
.stage:after{content:"";position:absolute;inset:0;pointer-events:none;z-index:4;box-shadow:inset 0 0 42px #723b4210;border-radius:inherit}
.stage[data-scene="room"]{background:linear-gradient(145deg,#fff6f4 2%,#f5e0e1 54%,#edd0d3 100%)}
.fallback{position:absolute;inset:0;z-index:1;transition:opacity .3s ease;pointer-events:none}
.fallback svg{display:block;width:100%;height:100%}
.fallback .svg-room{display:none}
.stage[data-scene="room"] .fallback .svg-box{display:none}
.stage[data-scene="room"] .fallback .svg-room{display:block}
.stage.is-webgl .fallback{opacity:0}
#lamai-canvas{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:2;opacity:0;pointer-events:none;touch-action:none;cursor:grab;transition:opacity .28s}
.stage.is-webgl #lamai-canvas{opacity:1;pointer-events:auto}
#lamai-canvas:active{cursor:grabbing}
.scene-label{position:absolute;z-index:3;top:18px;left:20px;pointer-events:none;max-width:65%}
.scene-label span{font:400 clamp(20px,2.8vw,30px)/1.1 Georgia,serif;letter-spacing:.015em;color:var(--plum)}
.scene-label small{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.2em;color:#a16478;margin-bottom:8px;font-weight:700}
.scene-note{position:absolute;z-index:3;bottom:18px;left:20px;max-width:70%;font-size:11px;letter-spacing:.01em;color:#624351;background:#fff8f0cf;padding:8px 11px;border-radius:30px;border:1px solid #ffffff77;pointer-events:none}
.scene-index{position:absolute;right:20px;bottom:22px;z-index:3;color:#855866;font:italic 18px Georgia,serif;pointer-events:none}
.controls{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-top:11px}
.control-actions{display:flex;gap:8px}
.controls button{background:#fff;border:1px solid #eed6da;padding:10px 13px;color:#73515d;border-radius:100px}
.controls button:focus-visible,.tabs button:focus-visible{outline:2px solid var(--berry);outline-offset:3px}
.controls button:disabled{opacity:.48;cursor:default}
.hint{font-size:11px;color:#886c74}
@media(max-width:650px){body{padding:10px}.head{align-items:start;flex-direction:column;gap:12px}.tabs{width:100%}.tabs button{flex:1}.stage{aspect-ratio:4/3;border-radius:14px}.scene-label{top:13px;left:14px;max-width:80%}.scene-label span{font-size:22px}.scene-note{left:12px;bottom:12px;font-size:10px;padding:6px 9px;max-width:84%}.scene-index{right:12px;bottom:15px}.controls{gap:9px}.hint{font-size:10px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}

html.lm-embed,html.lm-embed body{height:100%;background:#FFF4F6}
html.lm-embed body{padding:6px;display:flex;flex-direction:column}
html.lm-embed .lamai-3d{display:flex;flex-direction:column;height:100%;width:100%;max-width:none}
html.lm-embed .head{margin-bottom:6px}html.lm-embed .head > div:first-child{display:none}html.lm-embed .tabs{width:auto}
html.lm-embed .stage{aspect-ratio:auto;flex:1 1 auto;min-height:0}
html.lm-embed .controls{margin-top:6px}html.lm-embed .hint{display:none}
html.lm-embed .tabs button,html.lm-embed .controls button{min-height:40px}
html.lm-embed body{padding:0}html.lm-embed .lamai-3d{position:relative}
html.lm-embed .head{position:absolute;top:8px;right:8px;z-index:6;margin:0}html.lm-embed .tabs{background:#ffedf1e6}
html.lm-embed .stage{border-radius:0;border:0}
html.lm-embed .controls{position:absolute;left:8px;bottom:8px;z-index:6;margin:0}
html.lm-embed .scene-note,html.lm-embed .scene-index{display:none}
@media(max-width:560px){html.lm-embed .scene-label{display:none}html.lm-embed .tabs button{padding:8px 11px}}
</style>
